{{ define "main" }}
    <article>
      <div class="meta-row"> 
        <div class="back-button">
          {{ with .Parent }}
          <a href="{{ .RelPermalink }}">cd ..</a>
          {{ end }}
        </div>
        <time>{{ .Date.Format "January 2, 2006" }}</time>
      </div>
        <h1>{{ .Title }}</h1>
        <div class="entry-content">
            {{ .Content }}
        </div>
    </article>
{{ end }}
